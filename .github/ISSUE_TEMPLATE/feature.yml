name: Feature request · 功能建议
description: Something Kettu could do, or do better. · 希望 Kettu 能做的事。
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Link GitHub to your Kettu account on [kettu.sh](https://www.kettu.sh/account/sign-in/) and you earn points when this issue is accepted.
        在 [kettu.sh](https://www.kettu.sh/account/sign-in/) 的账号里绑定 GitHub，这条 issue 被采纳后你会得到积分。
  - type: textarea
    id: request
    attributes:
      label: What do you want, and why? · 想要什么，为什么
      description: One request per issue. Screenshots help. · 一个 issue 只提一件事，附截图更好。
    validations:
      required: true
