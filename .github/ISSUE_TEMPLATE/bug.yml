name: Bug report · 报告问题
description: Something doesn't work as it should. · 有东西不正常。
type: Bug
# Report a Problem in the app opens this form with version, os and logs filled in, so keep
# the file name and those ids.
body:
  - type: markdown
    attributes:
      value: |
        In Kettu, **Report a Problem…** fills in this form for you.
        在 Kettu 里用「报告问题…」，会自动帮你填好这张表。

        Link GitHub to your Kettu account on [kettu.sh](https://www.kettu.sh/account/sign-in/) and you earn points when this issue is accepted.
        在 [kettu.sh](https://www.kettu.sh/account/sign-in/) 的账号里绑定 GitHub，这条 issue 被采纳后你会得到积分。
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? · 发生了什么
      description: What you did, what you saw, what you expected. Screenshots help. · 做了什么、看到什么、本该怎样，附截图更好。
    validations:
      required: true
  # issue-platform.yml finds this answer by its label's "Which app" start and labels each option
  # by its English start. GitHub fills only text fields from a link, so the app cannot pick here.
  - type: dropdown
    id: platform
    attributes:
      label: Which app did it happen in? · 在哪个应用里出的问题
      description: Pick every app where you saw it. · 在哪些应用里遇到，就选哪些。
      multiple: true
      options:
        - Desktop app · 桌面应用
        - Web client · 网页客户端
        - iPhone / iPad app · iPhone / iPad 应用
        - Android app · Android 应用
        - Daemon or Docker · 守护进程或 Docker
        - Not sure · 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kettu version · 版本
      description: Settings › About, in the app you used · 在出问题的应用里看 设置 › 关于
      placeholder: 0.1.13
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System · 系统
      placeholder: macOS 26.1 / Windows 11 / iOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text · 报错
      render: text
