name: Release

on:
  push:
    tags: ['v*']
  # A run started by hand builds and tests every installer and joins the update files, without
  # touching a release. With the macOS signing secrets set, it also signs, notarizes and checks
  # the macOS builds, which is how new secrets are verified before a release depends on them.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides once per run: macOS is signed with the Developer ID when every signing secret is set,
  # and stays ad-hoc signed when none is; a half-configured set fails the run here. See
  # docs/design/updates.md#macos-signing.
  mac-signing:
    name: macOS signing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.decide.outputs.signed }}
      notarize: ${{ steps.decide.outputs.notarize }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: decide
        run: node tools/workflow/mac-signing.mjs
        # Only whether each secret is set reaches this job, never its value.
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}

  build:
    name: ${{ matrix.os }}
    needs: mac-signing
    strategy:
      fail-fast: false
      matrix:
        # Each architecture builds on its own runner, so node-pty is compiled or picked for the
        # machine that tests it.
        include:
          - os: macos-latest
            target: --mac --arm64
            # Only a Developer ID signed build can replace itself; an ad-hoc one links to the release.
            update_mode: ${{ needs.mac-signing.outputs.signed == 'true' && 'install' || 'link' }}
          - os: macos-15-intel
            target: --mac --x64
            update_mode: ${{ needs.mac-signing.outputs.signed == 'true' && 'install' || 'link' }}
          - os: windows-latest
            target: --win --x64
            update_mode: install
          - os: windows-11-arm
            target: --win --arm64
            update_mode: install
          - os: ubuntu-24.04
            target: --linux --x64
            update_mode: install
          - os: ubuntu-24.04-arm
            target: --linux --arm64
            update_mode: install
    runs-on: ${{ matrix.os }}
    env:
      MAC_SIGNED: ${{ startsWith(matrix.os, 'macos') && needs.mac-signing.outputs.signed == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          MAIN_VITE_UPDATE_MODE: ${{ matrix.update_mode }}
      # The Icon Composer app icon compiles only with Xcode 26's actool or later, which the macOS 15
      # image has but does not select.
      - name: Select Xcode 26 or later
        if: runner.os == 'macOS'
        run: |
          if [ "$(xcodebuild -version | head -1 | cut -d' ' -f2 | cut -d. -f1)" -lt 26 ]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
      - name: Package
        if: env.MAC_SIGNED != 'true'
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # Ad-hoc signed on macOS, unsigned elsewhere; keep electron-builder from picking an identity
          # from the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # notarytool takes the API key as a file; the secret holds the contents of the .p8 download.
      - name: Write the App Store Connect API key
        if: env.MAC_SIGNED == 'true' && needs.mac-signing.outputs.notarize == 'api-key'
        run: |
          (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/notarization-key.p8")
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/notarization-key.p8"; then
            echo "APPLE_API_KEY must hold the contents of the .p8 file" >&2
            exit 1
          fi
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      - name: Package, sign and notarize
        if: env.MAC_SIGNED == 'true'
        run: >-
          pnpm exec electron-builder ${{ matrix.target }} --publish never
          --config electron-builder.mac-signed.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Only the credentials the mac-signing job chose: electron-builder takes an Apple ID over
          # an API key whenever one is set.
          APPLE_API_KEY: ${{ needs.mac-signing.outputs.notarize == 'api-key' && format('{0}/notarization-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ needs.mac-signing.outputs.notarize == 'api-key' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.mac-signing.outputs.notarize == 'api-key' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ needs.mac-signing.outputs.notarize == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.mac-signing.outputs.notarize == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.mac-signing.outputs.notarize == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}
      # electron-builder skips notarization with only a warning when it lacks credentials, so every
      # signed build is checked. Gatekeeper checks the app, not the dmg, which electron-builder
      # leaves unsigned: the app is checked inside the dmg users download and the zip Squirrel.Mac
      # installs.
      - name: Check the signature and notarization
        if: env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            # With assessments off, spctl accepts anything and would prove nothing.
            if [ "$(spctl --status 2>&1)" = 'assessments enabled' ]; then
              spctl --assess --type execute -vv "$1" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
              if ! grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"; then
                echo "::error::Gatekeeper does not accept $1 as a notarized Developer ID app"
                exit 1
              fi
            else
              echo "::warning::Gatekeeper is off on this runner, so spctl could not assess $1"
            fi
            xcrun stapler validate "$1"
          }
          mount="$(mktemp -d)"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$mount"
          check "$mount/OverBench.app"
          hdiutil detach "$mount"
          unzipped="$(mktemp -d)"
          ditto -x -k dist/*.zip "$unzipped"
          check "$unzipped/OverBench.app"
      # Only the installers and the update file leave the runner. A signed macOS build adds the zip
      # that Squirrel.Mac installs from and its blockmap, from which electron-updater downloads only
      # the changed blocks; other blockmaps and unpacked apps stay behind.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-mac.zip.blockmap
            dist/*-setup.exe
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [mac-signing, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Join the update files
        env:
          MAC_SIGNED: ${{ needs.mac-signing.outputs.signed }}
        run: |
          mkdir release
          cp artifacts/*/*.dmg artifacts/*/*-setup.exe artifacts/*/*.AppImage release/
          # A signed macOS build lists its zip next to its dmg and ships the zip's blockmap.
          mac_files=2
          if [ "$MAC_SIGNED" = true ]; then
            cp artifacts/*/*.zip artifacts/*/*-mac.zip.blockmap release/
            mac_files=4
          fi
          # Each build wrote the update file for its own architecture. macOS and Windows clients read
          # one file that lists both, so the file lists are joined; Linux has a file per architecture.
          for feed in latest.yml:2 latest-mac.yml:$mac_files latest-linux.yml:1 latest-linux-arm64.yml:1; do
            name="${feed%:*}"
            yq eval-all '. as $item ireduce ({}; . *+ $item)' artifacts/*/"$name" > "release/$name"
            count="$(yq '.files | length' "release/$name")"
            if [ "$count" != "${feed#*:}" ]; then
              echo "$name lists $count files, expected ${feed#*:}" >&2
              exit 1
            fi
          done
          ls -l release
          tail -n +1 release/*.yml
      - name: Upload to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -z "$draft" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "OverBench ${GITHUB_REF_NAME#v}" --notes ''
          elif [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            echo "Release $GITHUB_REF_NAME is published; turn it back into a draft to rebuild it" >&2
            exit 1
          fi
