name: Update end to end

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA, branch or tag to check, if not the one dispatched from
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: update-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The *_RUNNER repository variables, when set, replace GitHub's runners.
        os:
          - ${{ vars.MACOS_RUNNER || 'macos-latest' }}
          - ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
          - ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Without the Developer ID the macOS check would stop at the Link mode notice, so it fails
      # instead. Only whether each secret is set reaches this step.
      - name: Require the signing certificate
        if: runner.os == 'macOS'
        env:
          HAS_CERTIFICATE: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_CERTIFICATE" != true ]; then
            echo "Signing the macOS builds needs the CSC_LINK and CSC_KEY_PASSWORD secrets" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The update mode is fixed at build time; the macOS builds are signed with the Developer ID,
      # so every platform installs in place.
      - run: pnpm build
        env:
          MAIN_VITE_UPDATE_MODE: install
      # The Icon Composer app icon compiles only with Xcode 26's actool or later.
      - name: Select Xcode 26 or later
        if: runner.os == 'macOS'
        run: |
          if [ "$(xcodebuild -version | head -1 | cut -d' ' -f2 | cut -d. -f1)" -lt 26 ]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          fi
          xcodebuild -version
      # Two builds to sign; notarizing is left to the release run, since Squirrel.Mac checks only
      # the signature.
      - name: Check updating
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node tools/update-e2e/run.mjs 2>&1 | tee update-e2e-${{ runner.os }}.log; exit ${PIPESTATUS[0]}
      - name: Check updating
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 20
        run: node tools/update-e2e/run.mjs 2>&1 | tee update-e2e-${{ runner.os }}.log; exit ${PIPESTATUS[0]}
      # xvfb-run's default screen is 640x480 at 8-bit colour.
      - name: Check updating
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" node tools/update-e2e/run.mjs 2>&1 | tee update-e2e-${{ runner.os }}.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: update-e2e-${{ runner.os }}
          path: update-e2e-${{ runner.os }}.log
          if-no-files-found: warn
