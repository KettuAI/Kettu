name: Update contributors

# Refreshes the community contributors avatar wall in README.md and README.zh-CN.md from public
# merged pull requests and accepted/completed public issues. Main is protected by a ruleset, so
# updates are proposed on a dedicated pull request branch rather than pushed directly to main.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    name: Refresh README contributors wall
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update contributors wall
        run: node tools/contributors/update-readme.mjs
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push branch and open or update pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="chore/update-contributors"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add README.md README.zh-CN.md
          git commit -m "docs(readme): refresh community contributors wall"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing pull request #$existing"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(readme): refresh community contributors wall" \
            --body "Automatically refreshes the community contributors avatar wall in README.md and README.zh-CN.md from public merged pull requests and accepted/completed public issues."
