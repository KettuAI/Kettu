name: CI

on:
  # Never on edits: the newest run on a commit gives its CI result, so a run that skipped the job
  # would hide a failure on that commit. The title and description have their own workflow, pr.yml.
  # Windows and macOS run before each release, in release.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name is the check the ruleset on main requires. A draft skips it, which counts as passing,
  # but a draft cannot merge and marking it ready runs it.
  check:
    name: CI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Type-checks first.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec electron-builder --dir --publish never
