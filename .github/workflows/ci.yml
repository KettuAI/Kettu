name: CI

on:
  # Never on edits: the newest run on a commit gives its CI result, so a run that skipped the job
  # would hide a failure on that commit. Building and packaging every platform is the release
  # run's gate, in release.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name is the check the ruleset on main requires. A skipped job still reports a check, which
  # counts as passing, so a draft's skipped run must not be named CI, or a pull request marked ready
  # could merge before the run that marking it ready starts has reported. GitHub shows a skipped
  # job's name unevaluated; evaluated, it would read `CI (draft)`. Neither is CI.
  check:
    name: ${{ github.event.pull_request.draft && 'CI (draft)' || 'CI' }}
    if: ${{ !github.event.pull_request.draft }}
    # The LINUX_RUNNER repository variable, when set, replaces GitHub's runner.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      # The merge commit and its base, so the diff between them is what the pull request changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Styles, docs and images have nothing to type-check or test, so the job passes without
      # running the rest. It still runs, since a skipped job would not report the CI check.
      - name: Look for code changes
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '\.(ts|tsx|mts|cts|js|mjs|cjs|json|yaml|yml)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code
        uses: pnpm/action-setup@v6
      - if: steps.changes.outputs.code
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.code
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code
        run: pnpm typecheck
      - if: steps.changes.outputs.code
        run: pnpm test
