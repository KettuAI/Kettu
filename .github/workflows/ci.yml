name: CI

on:
  # Never on edits: the newest run on a commit gives its CI result, so a run that skipped the job
  # would hide a failure on that commit. The title and description have their own workflow, pr.yml.
  # Windows and macOS run before each release, in release.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name is the check the ruleset on main requires. A skipped job still reports a check, which
  # counts as passing, so a draft's skipped run must not be named CI, or a pull request marked ready
  # could merge before the run that marking it ready starts has reported. GitHub shows a skipped
  # job's name unevaluated; evaluated, it would read `CI (draft)`. Neither is CI.
  check:
    name: ${{ github.event.pull_request.draft && 'CI (draft)' || 'CI' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Type-checks first.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec electron-builder --dir --publish never
