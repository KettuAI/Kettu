name: Screenshots

on:
  workflow_dispatch:
  # The release run calls it to see the app start on each platform.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**', 'tools/**', 'package.json', '.github/workflows/screenshots.yml']

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The runner's 1024 x 768 screen would shrink the default window.
      - name: Enlarge the screen
        if: runner.os == 'Windows'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Capture
        if: runner.os != 'Linux'
        run: node tools/screenshots/capture.mjs --out screenshots
      # xvfb-run's default screen is 640x480 at 8-bit colour.
      - name: Capture
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node tools/screenshots/capture.mjs --out screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: screenshots
          if-no-files-found: warn
