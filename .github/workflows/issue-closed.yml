name: Issue closed

# A closed issue keeps no state: label, whether a merged pull request's Closes or a person closed
# it, as completed or not planned. Run by hand, it clears the labels from every closed issue.
on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  clear:
    name: Clear the state labels
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        # With pipefail, so a gh command that fails in a pipe fails the step.
        shell: bash
    steps:
      # The labels are read when the job runs, not from the event, so one added after the close
      # goes too. The number reaches the script through the environment, never the script text.
      - name: From the closed issue
        if: github.event_name == 'issues'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          labels="$(gh issue view "$NUMBER" --json labels \
            --jq '[.labels[].name | select(startswith("state:"))] | join(",")')"
          if [ -n "$labels" ]; then
            gh issue edit "$NUMBER" --remove-label "$labels"
          fi
      - name: From every closed issue, a label at a time
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh label list --search 'state:' --limit 100 --json name \
            --jq '.[].name | select(startswith("state:"))' |
            while read -r label; do
              gh issue list --state closed --label "$label" --limit 1000 --json number \
                --jq '.[].number' |
                while read -r number; do
                  gh issue edit "$number" --remove-label "$label" < /dev/null
                done
            done
