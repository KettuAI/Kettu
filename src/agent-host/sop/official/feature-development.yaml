# Kettu's official SOP for a new feature, from the requirement to a merged pull request.
format: 1
name: Feature development
description: Research whether it is worth doing, design and plan it with your review, build it, review the code on another agent, then ship it.
locales:
  zh-CN:
    name: 功能开发
    description: 先调研值不值得做，设计和计划经你审阅，再开发、换一个 Agent 审查代码，最后发布。
    steps:
      research: 调研
      design: 设计方案
      plan: 计划
      build: 开发
      code-review: 代码审查
      ship: 发布
send_back_limit: 3
steps:
  - id: research
    name: Research
    hand_in: document
    hint: Reading and judgment; a mid-size model is usually enough, a strong one for a broad or unclear requirement.
    prompt: |
      Research the requirement before anyone designs it. Read the parts of the project it touches
      and anything it depends on, but change no file.

      Write a document artifact with what you found: what the requirement asks, what exists
      already, the options and their costs, the risks, and your recommendation. Then report
      whether it is worth doing.
    outcomes:
      - name: Worth doing
        to: design
      - name: Not worth doing
        end: dropped

  - id: design
    name: Design
    hand_in: document
    you_review: true
    hint: Decisions that shape the rest of the work; prefer a strong model.
    prompt: |
      Design the change. Read the research and the code it touches, then write a document
      artifact with the design: what changes for the user, the approach, the data and interfaces
      it adds or changes, and the alternatives you rejected and why. Change no file.

      If you were sent back, address every point you were given, and every comment on the
      document.
    outcomes:
      - name: Done
        to: plan

  - id: plan
    name: Plan
    hand_in: document
    you_review: true
    hint: Turning the design into steps; a mid-size model is usually enough.
    prompt: |
      Plan the build from the approved design. Write a document artifact with the steps in
      order, the files to change or add, the tests for the core of the change, and how the result
      can be checked. Change no file.

      If you were sent back, address every point you were given, and every comment on the
      document.
    outcomes:
      - name: Done
        to: build

  - id: build
    name: Build
    hand_in: note
    hint: The heaviest step; pick a strong model unless the change is small.
    prompt: |
      Build the change as the plan says, in this folder. Keep to what the requirement, the design
      and the plan need. Add or update tests for the core of the change, and run the project's
      checks. Commit your work on the current branch with clear messages. Do not push and do not
      open a pull request.

      If you were sent back, fix every point you were given first. In your note, say what you
      changed and how you checked it.
    outcomes:
      - name: Done
        to: code-review

  - id: code-review
    name: Code review
    hand_in: outcome
    review_of: [build]
    hint: Review on another agent than the one that built it when one is available.
    prompt: |
      Review the change on this branch against the design and the plan. Read the diff from the
      branch's base, run the project's checks, and look for bugs, missing tests and anything the
      plan asked for that is not there. Do not change any file.

      Report Approved when it is ready to ship. Report Changes needed when it is not, and list in
      your note every problem the builder must fix, each with the file and what is wrong.
    outcomes:
      - name: Approved
        to: ship
      - name: Changes needed
        to: build

  - id: ship
    name: Ship
    hand_in: outcome
    hint: Mechanical work; the fastest model is enough.
    prompt: |
      Ship the change: push the branch, open a pull request with a short description of what
      changed and why, and wait for its checks. When they pass, merge it as the repository does.

      Report Merged once it is merged. Report Checks failed when a check fails because of the
      change, and say in your note which check failed and what it said.
    outcomes:
      - name: Merged
        end: done
      - name: Checks failed
        to: build
