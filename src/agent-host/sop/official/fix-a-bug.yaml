# Kettu's official SOP for a bug, from reproducing it to a merged fix.
format: 1
name: Fix a bug
description: Reproduce the bug, fix it with a test, review the fix on another agent, then ship it.
locales:
  zh-CN:
    name: 修复 Bug
    description: 先复现，再带着测试修复，换一个 Agent 审查修复，最后发布。
    steps:
      reproduce: 复现
      fix: 修复
      review: 审查
      ship: 发布
send_back_limit: 3
steps:
  - id: reproduce
    name: Reproduce
    hand_in: outcome
    hint: Reading code and running it; a mid-size model is usually enough.
    prompt: |
      Reproduce the bug the requirement describes. Find the steps or the smallest input that
      shows it, and where in the code it comes from. Change no file of the project; scratch files
      outside it are fine.

      Report Reproduced with the steps and the cause you found in your note, or Cannot reproduce
      with what you tried.
    outcomes:
      - name: Reproduced
        to: fix
      - name: Cannot reproduce
        end: dropped

  - id: fix
    name: Fix
    hand_in: note
    hint: Pick by how deep the cause is; a strong model for a cause across several parts.
    prompt: |
      Fix the bug at its cause. First add a test that fails because of the bug, then make it
      pass, and run the project's checks. Commit your work on the current branch with a clear
      message. Do not push and do not open a pull request.

      If you were sent back, fix every point you were given. In your note, say what the cause was,
      what you changed and which test covers it.
    outcomes:
      - name: Done
        to: review

  - id: review
    name: Review
    hand_in: outcome
    review_of: [fix]
    hint: Review on another agent than the one that fixed it when one is available.
    prompt: |
      Review the fix on this branch. Check that the test fails without the fix and passes with
      it, that the fix is at the cause and not at a symptom, and that the project's checks pass.
      Do not change any file.

      Report Fixed when it is ready to ship. Report Not fixed when it is not, and list in your
      note every problem to fix.
    outcomes:
      - name: Fixed
        to: ship
      - name: Not fixed
        to: fix

  - id: ship
    name: Ship
    hand_in: outcome
    hint: Mechanical work; the fastest model is enough.
    prompt: |
      Ship the fix: push the branch, open a pull request that names the bug and the cause, and
      wait for its checks. When they pass, merge it as the repository does.

      Report Merged once it is merged. Report Checks failed when a check fails because of the
      fix, and say in your note which check failed and what it said.
    outcomes:
      - name: Merged
        end: done
      - name: Checks failed
        to: fix
