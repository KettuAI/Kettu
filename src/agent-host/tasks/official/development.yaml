# A change to a project from the requirement to tested code: whether it is worth doing, what it
# must do, how it is built, the build and the test.
format: 1
id: development
name: { en: Development, zh-CN: 开发流程 }
description:
  en: Review whether the requirement is worth doing, write the requirements and the design, build it, then test it.
  zh-CN: 先评审需求值不值得做，再写需求文档和设计方案，然后开发并测试。
nodes:
  - id: review
    name: { en: Review, zh-CN: 评审 }
    by: deep
    hand-in: verdict
    prompt: |
      Judge whether this requirement is worth doing at all, before anyone works on it. Read the
      parts of the project it touches and change nothing.

      Weigh what it gives the people who use the project against what it costs to build and to
      keep, whether the project already does it or part of it, and whether it fits where the
      project is going. Report that it is worth doing, or that it is not. Either way give your
      reasons: what you looked at and what decided it. A requirement too vague to judge is not
      worth doing as written; say what is missing.

      Write in the language of the requirement.
    outcomes:
      - id: worth-doing
        name: { en: Worth doing, zh-CN: 值得做 }
        to: requirements
      - id: not-worth-doing
        name: { en: Not worth doing, zh-CN: 不值得做 }
        end: dropped

  - id: requirements
    name: { en: Requirements, zh-CN: 需求文档 }
    by: standard
    hand-in: document
    prompt: |
      Write the requirements document: what must be true when this is done, not how to build it.
      Read the project first, and change none of its files.

      Cover who it is for and what they can do afterwards, the behavior in each case that matters,
      the edge cases and errors, what is deliberately left out, and how someone can check each
      point. Number the points so later steps can refer to them. Where the requirement leaves a
      choice open, make it and say why.

      If you were sent back here, change the document to answer the problem you were given, and
      say in your note what changed.

      Hand in the whole document. Write it and your note in the language of the requirement.
    outcomes:
      - id: written
        name: { en: Written, zh-CN: 已写好 }
        to: design

  - id: design
    name: { en: Design, zh-CN: 设计方案 }
    by: deep
    hand-in: document
    prompt: |
      Write the design: how the project will meet the requirements document. Read the code it
      touches first, and change none of it.

      Cover the approach and why it was chosen over the alternatives, the parts of the project that
      change and how, the data and interfaces that are added or changed, what could go wrong, and
      the order to build it in. Follow the project's own structure and conventions. Say how each
      numbered requirement is met.

      If the requirements cannot be designed as written, because they contradict each other,
      contradict the project, or leave out a decision the design depends on, send the work back to
      Requirements instead of guessing: hand in a document that lists each problem and what you
      need decided.

      If you were sent back here, change the design to answer the problem you were given.

      Hand in the whole document. Write it and your note in the language of the requirement.
    outcomes:
      - id: ready
        name: { en: Ready to build, zh-CN: 可以开发 }
        to: build
      - id: requirements-problem
        name: { en: Requirements need work, zh-CN: 需求有问题 }
        to: requirements

  - id: build
    name: { en: Build, zh-CN: 开发 }
    by: standard
    hand-in: note
    prompt: |
      Build what the design describes, so that every point of the requirements document holds.
      Follow the design and the project's conventions, add or change the tests the project expects
      for such a change, and run the project's own checks until they pass.

      If the design cannot work as written, report the design problem and send the work back to
      Design instead of working around it: say what you tried and why it fails.

      If you were sent back here, fix what the test found before anything else.

      In your note, say what you changed, what you ran to check it and anything the design did
      not cover. Write the note in the language of the requirement.
    outcomes:
      - id: built
        name: { en: Built, zh-CN: 开发完成 }
        to: test
      - id: design-problem
        name: { en: Design problem, zh-CN: 设计有问题 }
        to: design

  - id: test
    name: { en: Test, zh-CN: 测试 }
    by: standard
    hand-in: verdict
    prompt: |
      Test what was built against the requirements document, as someone who did not build it.
      Run the project's tests and checks, then try the change itself the way its users would,
      point by point, the edge cases and errors included. Fix nothing yourself.

      Report a pass only when every point holds and nothing else broke. Otherwise report a fail,
      which sends the work back to Build: name each point that fails, what you did, what you
      expected and what happened instead.

      Write in the language of the requirement.
    outcomes:
      - id: pass
        name: { en: Passed, zh-CN: 通过 }
        end: done
      - id: fail
        name: { en: Failed, zh-CN: 未通过 }
        to: build
