# Kettu's official workflow for reviewing existing code, ending in findings a person accepts.
format: 1
id: review
name: Code review
description: Settle what to review, review it, write the findings, then a person accepts them.
kind: review
version: '1.0.0'
worktree: false
start: scope
limits:
  rounds: 2
  stageMinutes: 60
  budgetUsd: null
stages:
  - id: scope
    name: Settle the scope
    kind: agent
    tier: standard
    scope: { level: read, web: false }
    session: new
    gate: agent
    evidence: [no-file-changes]
    prompt: |
      Settle what the review covers: the files, branch, commits or area the requirement names, and
      what to look for. Read enough of the project to list them. Do not change any file.

      Finish by calling the submit_stage tool. Submit `pass` with the fields below, or `blocked`,
      with the reason in the summary, when the person must say what to review.
    next: review
    contract:
      - name: targets
        type: list
        description: What to review, as paths, branches or commits.
      - name: focus
        type: list
        description: What to look for, such as correctness, security or performance.

  - id: review
    name: Review
    kind: agent
    tier: deep
    scope: { level: read, web: false }
    session: resume
    gate: contract
    evidence: [no-file-changes]
    prompt: |
      Review every target in the scope. Read the code and what it calls, and look for bugs,
      missing cases, security problems, missing tests and needless complexity. Check each problem
      against the code before you report it. Do not change any file.

      Finish by calling the submit_stage tool with `pass` and the fields below.
    next: findings
    contract:
      - name: problems
        type: list
        description: Each problem, with its file and line and why it is one.

  - id: findings
    name: Write the findings
    kind: agent
    tier: standard
    scope: { level: read, web: false }
    session: resume
    gate: contract
    evidence: [no-file-changes]
    prompt: |
      Write the review's findings for the person: a short verdict first, then each problem ordered
      by severity, with its location and a suggested fix. Do not change any file.

      If you are given notes from the person, revise the findings to address every one of them.

      Finish by calling the submit_stage tool with `pass` and the fields below.
    next: accept
    contract:
      - name: verdict
        type: text
        description: The overall verdict, in one or two sentences.
      - name: report
        type: text
        description: The findings, in Markdown, ordered by severity.

  - id: accept
    name: Accept
    kind: human
    prompt: Read the findings. Approve them, or send them back with what to look at again.
    sendBack: [findings, review]
    next: null
