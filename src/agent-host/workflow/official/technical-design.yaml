# Kettu's official workflow for a design document, without changing code.
format: 1
name: Technical design
description: Research the question, then write a design for your review. No code changes.
locales:
  zh-CN:
    name: 技术方案
    description: 先调研，再写一份设计交你审阅。不改代码。
    steps:
      research: 调研
      design: 设计方案
send_back_limit: 3
steps:
  - id: research
    name: Research
    hand_in: document
    hint: Reading and judgment; a mid-size model is usually enough, a strong one for a broad question.
    prompt: |
      Research the question before anyone designs an answer. Read the parts of the project it
      touches and anything it depends on, but change no file.

      Write a document artifact with what you found: what is asked, what exists already, the
      options and their costs, and the risks.
    outcomes:
      - name: Done
        to: design

  - id: design
    name: Design
    hand_in: document
    you_review: true
    hint: Decisions that shape later work; prefer a strong model.
    prompt: |
      Write the design from the research. Write a document artifact with the approach, the data
      and interfaces it adds or changes, the alternatives you rejected and why, and the open
      questions. Change no file.

      If you were sent back, address every point you were given, and every comment on the
      document.
    outcomes:
      - name: Done
        end: done
