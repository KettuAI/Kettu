[package]
name = "kettu-ios-device"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Streams an iPhone or iPad screen and injects input for Kettu's device host"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
  "ring",
  "usbmuxd",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "rsd",
  "display_stream",
  "springboardservices",
  "mobile_image_mounter",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
