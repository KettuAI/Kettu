appId: com.overbench.app
productName: OverBench
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # node-pty ships its sources and every platform's binaries; only the loader and the
  # binaries for the target platform are needed at runtime.
  - '!node_modules/node-pty/{binding.gyp,deps,scripts,src,third_party,typings}{,/**/*}'
  - '!node_modules/node-pty/build/{Makefile,*.mk,config.gypi,gyp-mac-tool,node_gyp_bins}{,/**/*}'
  - '!node_modules/node-pty/build/Release/{obj.target,.deps,node-addon-api@*}{,/**/*}'
  - '!node_modules/node-pty/**/*.{pdb,test.js,map}'
# The terminal host loads pty.node and starts spawn-helper from the real file system.
asarUnpack:
  - node_modules/node-pty/**
# The postinstall step (electron-builder install-app-deps) already built node-pty for Electron,
# including the from-source build on Linux, where node-pty has no prebuilt binary.
npmRebuild: false
publish:
  provider: github
  owner: overbench
  repo: overbench
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # Squirrel.Mac installs updates from a zip, which needs a Developer ID first; until then the
  # update links to the release and the dmg is all a release needs.
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  # No Developer ID yet. Left unsigned, a downloaded build is reported as damaged; an ad-hoc
  # signature keeps the bundle valid, so Gatekeeper offers Open Anyway instead. The hardened
  # runtime would refuse to load the ad-hoc signed Electron framework (no Team ID), so it stays
  # off until a Developer ID signs the app.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  files:
    - '!node_modules/node-pty/prebuilds/win32-*{,/**/*}'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: nsis
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*{,/**/*}'
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

linux:
  target: AppImage
  category: Development
  files:
    - '!node_modules/node-pty/prebuilds{,/**/*}'
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
