appId: com.overbench.app
productName: OverBench
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # node-pty ships its sources and every platform's binaries; only the loader and the
  # binaries for the target platform are needed at runtime.
  - '!node_modules/node-pty/{binding.gyp,deps,scripts,src,third_party,typings}{,/**/*}'
  - '!node_modules/node-pty/build/{Makefile,*.mk,config.gypi,gyp-mac-tool,node_gyp_bins}{,/**/*}'
  - '!node_modules/node-pty/build/Release/{obj.target,.deps,node-addon-api@*}{,/**/*}'
  - '!node_modules/node-pty/**/*.{pdb,test.js,map}'
# The terminal host loads pty.node and starts spawn-helper from the real file system.
asarUnpack:
  - node_modules/node-pty/**
# The postinstall step (tools/install/app-deps.mjs) already readied node-pty for Electron: its
# prebuilt binaries on Windows, a build from source on macOS and Linux.
npmRebuild: false
publish:
  provider: github
  owner: overbench
  repo: overbench
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # Compiled by Xcode 26's actool into Assets.car and an .icns for older macOS.
  icon: build/icon.icon
  # Without a Developer ID the update links to the release, so the dmg is all a release needs.
  # electron-builder.mac-signed.yml adds the zip that Squirrel.Mac installs from.
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signing, for local builds and releases without the signing secrets; a Developer ID
  # build uses electron-builder.mac-signed.yml. Left
  # unsigned, a downloaded build is reported as damaged; an ad-hoc signature keeps the bundle
  # valid, so Gatekeeper offers Open Anyway instead. The hardened runtime would refuse to load the
  # ad-hoc signed Electron framework (no Team ID), so it is on only with the Developer ID.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  files:
    - '!node_modules/node-pty/prebuilds/win32-*{,/**/*}'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: nsis
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*{,/**/*}'
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

linux:
  target: AppImage
  category: Development
  files:
    - '!node_modules/node-pty/prebuilds{,/**/*}'
appImage:
  # No version in the name: an update replaces the file a launcher already points at.
  artifactName: ${productName}-${arch}.${ext}
